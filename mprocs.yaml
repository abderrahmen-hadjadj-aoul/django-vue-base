# Run both dev servers together:  mprocs
# (launch from the project root, where this file lives)
procs:
  backend:
    shell: ".venv/bin/python manage.py runserver"
    cwd: backend
  frontend:
    shell: "pnpm dev"
    cwd: frontend
  frontend-typecheck:
    shell: "pnpm type-check"
    cwd: frontend
  # Apply Django migrations. Not started automatically — select the proc in the
  # mprocs UI and press `s` (start) to run on demand.
  backend-migrate:
    shell: ".venv/bin/python manage.py migrate"
    cwd: backend
    autostart: false
  # Django unit tests. Not started automatically — select the proc in the mprocs
  # UI and press `s` (start) to run on demand.
  backend-tests:
    shell: ".venv/bin/python manage.py test --verbosity=2"
    cwd: backend
    autostart: false
  # Backend test coverage (coverage.py). Runs the suite under coverage, prints a
  # per-file report with missing lines, and writes a browsable HTML report to
  # backend/htmlcov/ (open htmlcov/index.html). Config in backend/.coveragerc.
  # Not started automatically — select the proc and press `s` (start) on demand.
  backend-coverage:
    shell: ".venv/bin/coverage run manage.py test && .venv/bin/coverage report && .venv/bin/coverage html"
    cwd: backend
    autostart: false
  # Create a DEVELOPMENT-ONLY admin/superuser so you can log into /admin/.
  # Credentials: admin@example.com / admin (email is used as the username to
  # match this app's email-as-identity convention — see CLAUDE.md). Idempotent:
  # `|| true` swallows the "already exists" error on re-run. Not started
  # automatically — select the proc in the mprocs UI and press `s` to run.
  # NEVER use these creds (or this proc) in production.
  backend-createadmin:
    shell: "DJANGO_SUPERUSER_PASSWORD=admin .venv/bin/python manage.py createsuperuser --noinput --username admin@example.com --email admin@example.com || true"
    cwd: backend
    autostart: false
  # E2E (Gherkin via playwright-bdd, real backend). Not started automatically —
  # select the proc in the mprocs UI and press `s` (start) to run on demand.
  # These spin up their OWN dedicated servers (frontend :5273 → backend :8001 on
  # a throwaway SQLite DB), so they're independent of the dev procs above.
  e2e:
    shell: "pnpm test:e2e"
    cwd: frontend
    autostart: false
  e2e-ui:
    # Opens Playwright UI mode (watch, time-travel, pick locators, re-run) —
    # https://playwright.dev/docs/test-ui-mode. Works because playwright-bdd runs
    # the Gherkin specs through the @playwright/test runner.
    shell: "pnpm test:e2e:ui"
    cwd: frontend
    autostart: false
  # The DONE gate. Runs all three DONE checks sequentially (backend coverage
  # tests at 100%, frontend type-check, frontend e2e) and prints a per-item
  # OK / NOT OK summary plus a single GLOBAL verdict. Work is only DONE when it
  # reports GLOBAL … OK. Not started automatically — select the proc and press
  # `s` (start) to run on demand.
  check:
    shell: "./check.sh"
    autostart: false
